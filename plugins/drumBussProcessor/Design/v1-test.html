<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drumBussProcessor</title>
    <!-- PRODUCTION CSS EMBEDDED -->
    <style>
        :root {
            /* Palette */
            --color-bg: #111115;
            --color-surface: #1E1E24;
            --color-surface-hl: #2A2A33;
            --color-primary: #00FFFF;
            --color-secondary: #FF0099;
            --color-accent: #00FFFF;
            --color-text-primary: #F0F0F5;
            --color-text-secondary: #A0A0B0;
            --color-border: #333340;

            /* Typography */
            --font-headings: Inter, sans-serif;
            --font-body: Inter, sans-serif;
            --font-size-sm: 12px;
            
            /* Components */
            --border-radius: 4px;
            --border-width: 1px;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            color: var(--color-text-primary);
            font-family: var(--font-body);
            margin: 0;
            width: 940px;
            height: 600px;
            overflow: hidden;
        }

        /* --- Layout --- */
        .plugin-container {
            background: linear-gradient(170deg, var(--color-surface) 0%, var(--color-bg) 100%);
            border: var(--border-width) solid var(--color-border);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-top: 4px solid var(--color-primary);
            position: relative;
        }

        /* Screw Detail */
        .screw {
            width: 12px;
            height: 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .screw::after { content: ''; width: 100%; height: 1px; background: #444; transform: rotate(45deg); }
        .screw-tl { top: 8px; left: 8px; }
        .screw-tr { top: 8px; right: 8px; }
        .screw-bl { bottom: 8px; left: 8px; }
        .screw-br { bottom: 8px; right: 8px; }

        .plugin-header {
            height: 70px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
        }

        .plugin-title {
            font-family: var(--font-headings);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 1.25rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            color: var(--color-text-primary);
        }

        .plugin-body {
            flex: 1;
            padding: 32px;
            display: grid;
            grid-template-columns: 200px 1fr 200px; /* Left (Input), Center (Macro), Right (Output) */
            gap: 32px;
        }

        /* Panels */
        .panel-inset {
            background-color: rgba(0,0,0,0.2);
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.5);
            border-bottom: 1px solid var(--color-surface-hl);
            border-radius: var(--border-radius);
            position: relative;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .panel-outlined {
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            position: relative;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .panel-label-tag {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            font-size: 0.65rem;
            font-weight: bold;
            opacity: 0.6;
            letter-spacing: 0.15em;
            border-bottom-right-radius: 4px;
            border-right: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-transform: uppercase;
        }

        .footer {
            height: 32px;
            background-color: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 0.7rem;
            opacity: 0.4;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* --- Components --- */

        /* Knob */
        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: ns-resize;
            user-select: none;
            position: relative;
        }
        .knob-container svg {
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }
        .knob-label {
            color: var(--color-text-secondary);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Fader */
        .fader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            height: 100%;
            cursor: ns-resize;
            user-select: none;
        }

        .fader-track {
            position: relative;
            width: 32px;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        .fader-groove {
            width: 6px;
            height: 100%;
            background-color: rgba(0,0,0,0.3);
            border-radius: 4px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
            border-bottom: 1px solid var(--color-surface-hl);
            position: relative;
            overflow: hidden;
        }

        .fader-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--color-primary);
            opacity: 0.6;
            height: 50%; /* Mock value */
        }

        .fader-handle {
            position: absolute;
            top: 50%; /* Mock value */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 48px;
            background: linear-gradient(180deg, var(--color-surface-hl) 0%, var(--color-surface) 100%);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 10;
        }

        .fader-grip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .fader-grip div { width: 16px; height: 1px; background: rgba(0,0,0,0.4); }
        .fader-grip div.accent { height: 2px; background: var(--color-accent); opacity: 0.8; }

        /* Bypass Toggle */
        .toggle-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--color-border);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: var(--color-text-secondary);
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: rgba(0, 255, 255, 0.1);
            border-color: var(--color-primary);
            color: var(--color-primary);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="plugin-container">
        <!-- Screws -->
        <div class="screw screw-tl"></div><div class="screw screw-tr"></div>
        <div class="screw screw-bl"></div><div class="screw screw-br"></div>

        <!-- Header -->
        <div class="plugin-header">
            <div class="plugin-title">drumBussProcessor</div>
            <div id="bypass-control" class="toggle-btn">BYPASS</div>
        </div>
        
        <!-- Body -->
        <div class="plugin-body">
            
            <!-- LEFT PANEL: INPUT -->
            <div class="panel-inset">
                <div class="panel-label-tag">INPUT</div>
                <div class="knob-container" id="input_trim-control">
                    <svg viewBox="0 0 64 64" width="80" height="80" style="overflow: visible;">
                        <!-- Track -->
                        <path d="M12.2 51.8 A 28 28 0 1 1 51.8 51.8" 
                              fill="none" stroke="var(--color-surface)" stroke-width="6" stroke-linecap="round" style="filter: brightness(0.7);" />
                        <!-- Value Arc -->
                        <circle class="value-arc" cx="32" cy="32" r="28" fill="none" stroke="var(--color-primary)" 
                                stroke-width="6" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="88" transform="rotate(135 32 32)" />
                    </svg>
                    <span class="knob-label">TRIM</span>
                    <div style="font-size: 0.7em; color: var(--color-primary);">0.0 dB</div>
                </div>
            </div>

            <!-- CENTER PANEL: MIX READY MACRO -->
            <div class="panel-outlined" style="background: rgba(255,255,255,0.02);">
                <div class="panel-label-tag" style="background: var(--color-primary); color: #000; opacity: 1;">MACRO</div>
                
                <div class="knob-container" id="mix_ready-control">
                    <svg viewBox="0 0 64 64" width="220" height="220" style="overflow: visible;">
                        <!-- Glow -->
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        
                        <!-- Track -->
                        <path d="M12.2 51.8 A 28 28 0 1 1 51.8 51.8" 
                              fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" />
                        
                        <!-- Value Arc -->
                        <circle class="value-arc" cx="32" cy="32" r="28" fill="none" stroke="var(--color-primary)" 
                                stroke-width="3" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="140" 
                                transform="rotate(135 32 32)" style="filter: url(#glow);" />
                        
                        <!-- Inner Deco -->
                        <circle cx="32" cy="32" r="22" fill="#111" stroke="#333" stroke-width="1" />
                        <text x="32" y="36" text-anchor="middle" fill="#fff" font-size="6" font-family="Inter" font-weight="bold">MIX READY</text>
                    </svg>
                    
                    <div style="font-size: 1.5em; font-weight: bold; color: var(--color-primary); text-shadow: 0 0 10px rgba(0,255,255,0.3);">20%</div>
                </div>
            </div>

            <!-- RIGHT PANEL: OUTPUT & METER -->
            <div class="panel-inset">
                <div class="panel-label-tag">OUTPUT</div>
                <div style="display: flex; gap: 24px; height: 100%; align-items: flex-end; padding-top: 20px;">
                    
                    <!-- Fader -->
                    <div class="fader-container" id="output_trim-control">
                        <div class="fader-track">
                            <div class="fader-groove">
                                 <div class="fader-fill" style="height: 50%;"></div>
                            </div>
                            <div class="fader-handle" style="top: 50%;">
                                <div class="fader-grip">
                                    <div></div><div class="accent"></div><div></div>
                                </div>
                            </div>
                        </div>
                        <span class="knob-label">TRIM</span>
                    </div>

                    <!-- Meters -->
                    <div style="width: 16px; height: 80%; background: #000; border-radius: 2px; border: 1px solid #333; display: flex; flex-direction: column-reverse; gap: 1px; padding: 1px;">
                         <!-- Mock segments -->
                        <div style="height: 5%; background: #ef4444; opacity: 0.2;"></div>
                        <div style="height: 5%; background: #ef4444; opacity: 0.2;"></div>
                        <div style="height: 5%; background: #eab308; opacity: 0.2;"></div>
                        <div style="height: 5%; background: #eab308; opacity: 0.2;"></div>
                        <div style="height: 5%; background: #22c55e; opacity: 1;"></div>
                        <div style="height: 5%; background: #22c55e; opacity: 1;"></div>
                        <div style="height: 5%; background: #22c55e; opacity: 1;"></div>
                        <div style="height: 5%; background: #22c55e; opacity: 1;"></div>
                        <div style="height: 5%; background: #22c55e; opacity: 1;"></div>
                        <div style="height: 5%; background: #22c55e; opacity: 1;"></div>
                    </div>
                </div>
            </div>

        </div>
        
        <!-- Footer -->
        <div class="footer">
            <span>drumBussProcessor v1.0.0</span>
            <span>NEOGRID DESIGN</span>
        </div>
    </div>

    <!-- PREVIEW JS -->
    <script type="module">
        console.log("drumBussProcessor UI Loaded");
        // Simple interactivity for preview
        const inputs = ['input_trim', 'mix_ready', 'output_trim'];
        inputs.forEach(id => {
            const el = document.getElementById(id + '-control');
            if(el) {
                el.addEventListener('click', () => {
                   console.log(`Clicked ${id}`); 
                });
            }
        });
    </script>
</body>
</html>
