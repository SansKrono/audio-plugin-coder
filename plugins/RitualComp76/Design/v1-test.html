<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RitualComp76 Plugin</title>
<style>
  :root {
    --bg: #101014;
    --surface: #1A1A1F;
    --surface-hl: #292930;
    --primary: #FFC300;
    --primary-dim: rgba(255, 195, 0, 0.16);
    --secondary: #00FFF0;
    --secondary-dim: rgba(0, 255, 240, 0.14);
    --danger: #FF4D3D;
    --text: #F0F0F5;
    --text-dim: #A0A0A5;
    --border: #3A3A45;
    --font: "Roboto Mono", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    width: 760px;
    height: 380px;
    overflow: hidden;
  }

  #plugin-ui {
    width: 760px;
    height: 380px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-top: 3px solid var(--primary);
  }

  /* ---------- Header ---------- */
  .header {
    height: 48px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.18em; }
  .wordmark span { color: var(--primary); }
  .subtitle { font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); }

  .power {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-hl);
    display: grid; place-items: center;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .power svg { width: 14px; height: 14px; stroke: var(--text-dim); transition: stroke .15s; }
  .power.on { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,195,0,0.35); }
  .power.on svg { stroke: var(--primary); }

  /* ---------- Body ---------- */
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: 124px 124px 1fr 96px 104px;
    padding: 0 20px;
    column-gap: 12px;
    align-items: stretch;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
  }
  .col.divider::after {
    content: "";
    position: absolute;
    right: -6px; top: 18px; bottom: 18px;
    width: 1px;
    background: var(--border);
  }

  .control { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .value {
    font-size: 13px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    min-height: 16px;
  }
  .value.small { font-size: 11px; color: var(--text-dim); }
  .knob { cursor: ns-resize; touch-action: none; display: block; }

  /* ---------- Meter ---------- */
  .meter-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #vu-meter { display: block; transition: opacity .2s; }
  #vu-meter.off { opacity: 0.4; }

  .segmented {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 236px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .segmented button {
    height: 26px;
    border: 0;
    border-right: 1px solid var(--border);
    background: var(--surface-hl);
    color: var(--text-dim);
    font: 600 11px/1 var(--font);
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  .segmented button:last-child { border-right: 0; }
  .segmented button:hover { color: var(--text); }
  .segmented button.active { background: var(--primary-dim); color: var(--primary); }

  /* ---------- Ratio ---------- */
  .ratio-stack { display: flex; flex-direction: column; gap: 6px; width: 84px; }
  .ratio-btn {
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface-hl);
    color: var(--text-dim);
    font: 600 12px/1 var(--font);
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s, box-shadow .12s;
  }
  .ratio-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .ratio-btn.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }
  .ratio-btn.all-on {
    background: var(--secondary-dim); border-color: var(--secondary); color: var(--secondary);
    box-shadow: 0 0 8px rgba(0,255,240,0.25);
  }
  .ratio-btn.all { height: 26px; font-size: 11px; margin-top: 4px; }
  .ratio-caption { font-size: 10px; letter-spacing: 0.12em; color: var(--text-dim); height: 12px; text-align: center; }
  .ratio-caption.all { color: var(--secondary); }

  /* ---------- Footer ---------- */
  .footer {
    height: 28px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
  }
  #gr-readout { font-variant-numeric: tabular-nums; color: var(--text); }
  #gr-readout b { color: var(--text-dim); font-weight: 400; margin-right: 8px; }

  #plugin-ui.bypassed .body { opacity: 0.55; }
</style>
</head>
<body>
<div id="plugin-ui">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="wordmark">RITUALCOMP<span>76</span></div>
      <div class="subtitle">FET LIMITING AMPLIFIER</div>
    </div>
    <div class="power on" id="bypass-control" title="Power (bypass)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
      </svg>
    </div>
  </div>

  <!-- Body -->
  <div class="body">
    <div class="col">
      <div class="control" id="input-control">
        <div class="label">Input</div>
        <canvas class="knob" id="input-knob" width="112" height="112"></canvas>
        <div class="value" id="input-value">-24 dB</div>
      </div>
    </div>

    <div class="col divider">
      <div class="control" id="output-control">
        <div class="label">Output</div>
        <canvas class="knob" id="output-knob" width="112" height="112"></canvas>
        <div class="value" id="output-value">-24 dB</div>
      </div>
    </div>

    <div class="col divider">
      <div class="meter-wrap">
        <canvas id="vu-meter" width="236" height="140"></canvas>
        <div class="segmented" id="meter_mode-control">
          <button data-value="GR" class="active">GR</button>
          <button data-value="+8">+8</button>
          <button data-value="+4">+4</button>
          <button data-value="Off">OFF</button>
        </div>
      </div>
    </div>

    <div class="col divider" style="gap:14px">
      <div class="control" id="attack-control">
        <div class="label">Attack</div>
        <canvas class="knob" id="attack-knob" width="68" height="68"></canvas>
        <div class="value small" id="attack-value">3.0</div>
      </div>
      <div class="control" id="release-control">
        <div class="label">Release</div>
        <canvas class="knob" id="release-knob" width="68" height="68"></canvas>
        <div class="value small" id="release-value">5.0</div>
      </div>
    </div>

    <div class="col">
      <div class="label">Ratio</div>
      <div class="ratio-stack" id="ratio-control">
        <button class="ratio-btn" data-ratio="4">4</button>
        <button class="ratio-btn" data-ratio="8">8</button>
        <button class="ratio-btn" data-ratio="12">12</button>
        <button class="ratio-btn" data-ratio="20">20</button>
        <button class="ratio-btn all" data-ratio="All">ALL</button>
      </div>
      <div class="ratio-caption" id="ratio-value"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>RITUALCOMP76 v0.0.1</span>
    <span id="gr-readout"><b>GR</b>0.0 dB</span>
  </div>
</div>

<script type="module">
/* =====================================================================
 * Parameter bridge
 * Preview: local state only. Production (/impl): route set() to the JUCE
 * frontend relays (getSliderState / getToggleState / getComboBoxState)
 * and feed meters from a native event instead of the simulator below.
 * ===================================================================== */
const DEFAULTS = { input: -24, output: -24, attack: 3, release: 5, ratio: "4", meter_mode: "GR", bypass: false };
const state = { ...DEFAULTS };
const isJuce = typeof window.__JUCE__ !== "undefined";

function setParam(id, value) {
  state[id] = value;
  if (isJuce) {
    // Wired in /impl via JUCE frontend library.
  }
}

/* ---------- Helpers ---------- */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {
  bg: css("--bg"), hl: css("--surface-hl"), primary: css("--primary"), secondary: css("--secondary"),
  danger: css("--danger"), text: css("--text"), dim: css("--text-dim"), border: css("--border"),
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const attackTime = v => 800 * Math.pow(20 / 800, (v - 1) / 6);       // µs
const releaseTime = v => 1100 * Math.pow(50 / 1100, (v - 1) / 6);    // ms

function setupHiDPI(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width, h = canvas.height;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  return { ctx, w, h };
}

/* ---------- Rotary knob ---------- */
class Knob {
  constructor(id, { min, max, def, toNorm, fromNorm, format, onChange }) {
    this.canvas = document.getElementById(id + "-knob");
    this.valueEl = document.getElementById(id + "-value");
    Object.assign(this, { id, min, max, def, onChange });
    this.toNorm = toNorm || (v => (v - min) / (max - min));
    this.fromNorm = fromNorm || (n => min + n * (max - min));
    this.format = format;
    const { ctx, w } = setupHiDPI(this.canvas);
    this.ctx = ctx; this.size = w;
    this.norm = this.toNorm(def);
    this.hover = false; this.dragging = false;
    this.bind();
    this.render();
  }
  bind() {
    const c = this.canvas;
    let lastY = 0;
    c.addEventListener("pointerdown", e => {
      c.setPointerCapture(e.pointerId); this.dragging = true; lastY = e.clientY; this.render();
    });
    c.addEventListener("pointermove", e => {
      if (!this.dragging) return;
      const dy = lastY - e.clientY; lastY = e.clientY;
      this.setNorm(this.norm + dy * (e.shiftKey ? 0.001 : 0.005));
    });
    const end = () => { this.dragging = false; this.render(); };
    c.addEventListener("pointerup", end);
    c.addEventListener("pointercancel", end);
    c.addEventListener("pointerenter", () => { this.hover = true; this.render(); });
    c.addEventListener("pointerleave", () => { this.hover = false; this.render(); });
    c.addEventListener("wheel", e => {
      e.preventDefault();
      this.setNorm(this.norm - Math.sign(e.deltaY) * (e.shiftKey ? 0.005 : 0.025));
    }, { passive: false });
    c.addEventListener("dblclick", () => this.setNorm(this.toNorm(this.def)));
  }
  setNorm(n) {
    this.norm = clamp(n, 0, 1);
    const v = this.fromNorm(this.norm);
    this.onChange(v);
    this.render();
  }
  render() {
    const { ctx, size: s } = this;
    const cx = s / 2, cy = s / 2, r = s / 2 - 6;
    const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
    const av = a0 + (a1 - a0) * this.norm;
    ctx.clearRect(0, 0, s, s);

    // body
    ctx.beginPath(); ctx.arc(cx, cy, r - 6, 0, Math.PI * 2);
    ctx.fillStyle = C.hl; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = C.border; ctx.stroke();

    // track
    ctx.lineCap = "round";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1);
    ctx.strokeStyle = this.hover || this.dragging ? C.border : C.bg; ctx.stroke();

    // value arc
    if (this.norm > 0.001) {
      ctx.save();
      if (this.dragging) { ctx.shadowColor = C.primary; ctx.shadowBlur = 8; }
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, av);
      ctx.strokeStyle = C.primary; ctx.stroke();
      ctx.restore();
    }

    // pointer
    const ri = (r - 6) * 0.35, ro = (r - 6) * 0.72;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(av) * ri, cy + Math.sin(av) * ri);
    ctx.lineTo(cx + Math.cos(av) * ro, cy + Math.sin(av) * ro);
    ctx.strokeStyle = C.text; ctx.stroke();

    this.valueEl.textContent = this.format(this.fromNorm(this.norm));
  }
}

/* Input/Output: norm 0 = ∞ (mute), else -48..0 dB */
const attenToNorm = v => (v === -Infinity ? 0 : clamp((v + 48) / 48, 0, 1));
const attenFromNorm = n => (n <= 0.0001 ? -Infinity : -48 + n * 48);
const fmtAtten = v => (v === -Infinity ? "∞" : `${Math.round(v)} dB`);
const fmtStep = (v, t) => `${v.toFixed(1)} · ${t}`;

new Knob("input", {
  min: -48, max: 0, def: DEFAULTS.input, toNorm: attenToNorm, fromNorm: attenFromNorm,
  format: fmtAtten, onChange: v => setParam("input", v),
});
new Knob("output", {
  min: -48, max: 0, def: DEFAULTS.output, toNorm: attenToNorm, fromNorm: attenFromNorm,
  format: fmtAtten, onChange: v => setParam("output", v),
});
new Knob("attack", {
  min: 1, max: 7, def: DEFAULTS.attack,
  format: v => fmtStep(v, `${Math.round(attackTime(v))} µs`),
  onChange: v => setParam("attack", v),
});
new Knob("release", {
  min: 1, max: 7, def: DEFAULTS.release,
  format: v => fmtStep(v, `${Math.round(releaseTime(v))} ms`),
  onChange: v => setParam("release", v),
});

/* ---------- Ratio buttons ---------- */
const ratioEl = document.getElementById("ratio-control");
const ratioBtns = [...ratioEl.querySelectorAll(".ratio-btn:not(.all)")];
const allBtn = ratioEl.querySelector(".ratio-btn.all");
const ratioCaption = document.getElementById("ratio-value");
let pressed = new Set(["4"]);

function ratioFromPressed() {
  if (pressed.size === 0) return "Out";
  if (pressed.size >= 2) return "All";
  return [...pressed][0];
}
function renderRatio() {
  const r = ratioFromPressed();
  setParam("ratio", r);
  ratioBtns.forEach(b => {
    b.classList.toggle("active", r !== "All" && pressed.has(b.dataset.ratio));
    b.classList.toggle("all-on", r === "All");
  });
  allBtn.classList.toggle("all-on", r === "All");
  ratioCaption.textContent = r === "Out" ? "OUT · COLOR ONLY" : r === "All" ? "ALL BUTTONS IN" : `${r}:1`;
  ratioCaption.classList.toggle("all", r === "All");
}
ratioBtns.forEach(b => b.addEventListener("click", e => {
  const k = b.dataset.ratio;
  if (e.shiftKey) {
    pressed.has(k) ? pressed.delete(k) : pressed.add(k);
  } else if (pressed.size === 1 && pressed.has(k)) {
    pressed.clear();                 // click active → Out
  } else {
    pressed = new Set([k]);          // radio select
  }
  renderRatio();
}));
allBtn.addEventListener("click", () => {
  pressed = ratioFromPressed() === "All" ? new Set(["4"]) : new Set(["4", "8", "12", "20"]);
  renderRatio();
});
renderRatio();

/* ---------- Meter mode ---------- */
const meterModeEl = document.getElementById("meter_mode-control");
meterModeEl.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  meterModeEl.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
  setParam("meter_mode", b.dataset.value);
  document.getElementById("vu-meter").classList.toggle("off", b.dataset.value === "Off");
});

/* ---------- Power / bypass ---------- */
const powerEl = document.getElementById("bypass-control");
powerEl.addEventListener("click", () => {
  setParam("bypass", !state.bypass);
  powerEl.classList.toggle("on", !state.bypass);
  document.getElementById("plugin-ui").classList.toggle("bypassed", state.bypass);
});

/* ---------- VU meter ---------- */
const vu = setupHiDPI(document.getElementById("vu-meter"));
const VU_MIN = -20, VU_MAX = 3;
const amp = db => Math.pow(10, db / 20);
const vuPos = db => clamp((amp(db) - amp(VU_MIN)) / (amp(VU_MAX) - amp(VU_MIN)), 0, 1);
const SWEEP = 0.82;                           // radians each side of vertical
const pivot = { x: vu.w / 2, y: vu.h + 18 };
const R = vu.h + 4;                           // scale radius = R - 30 = 114

function drawVU(needleDb, modeLabel) {
  const { ctx, w, h } = vu;
  ctx.clearRect(0, 0, w, h);

  // face
  ctx.fillStyle = C.bg;
  ctx.strokeStyle = C.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(0.5, 0.5, w - 1, h - 1, 4); ctx.fill(); ctx.stroke();

  ctx.save();
  ctx.beginPath(); ctx.roundRect(1, 1, w - 2, h - 2, 4); ctx.clip();

  const ang = p => -Math.PI / 2 - SWEEP + p * SWEEP * 2;
  const scaleR = R - 30;

  // scale arcs
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = C.dim;
  ctx.beginPath(); ctx.arc(pivot.x, pivot.y, scaleR, ang(0), ang(vuPos(0))); ctx.stroke();
  ctx.strokeStyle = C.danger; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(pivot.x, pivot.y, scaleR, ang(vuPos(0)), ang(1)); ctx.stroke();

  // ticks + numbers
  const ticks = [-20, -10, -7, -5, -3, -1, 0, 1, 2, 3];
  ctx.font = "9px " + css("--font");
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ticks.forEach(t => {
    const a = ang(vuPos(t));
    const hot = t > 0;
    ctx.strokeStyle = hot ? C.danger : C.dim; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pivot.x + Math.cos(a) * (scaleR + 2), pivot.y + Math.sin(a) * (scaleR + 2));
    ctx.lineTo(pivot.x + Math.cos(a) * (scaleR + 8), pivot.y + Math.sin(a) * (scaleR + 8));
    ctx.stroke();
    ctx.fillStyle = hot ? C.danger : C.dim;
    const label = t > 0 ? `+${t}` : `${t}`;
    if (t !== -7 && t !== -1 && t !== 1) {
      ctx.fillText(label, pivot.x + Math.cos(a) * (scaleR + 17), pivot.y + Math.sin(a) * (scaleR + 17));
    }
  });

  // labels
  ctx.fillStyle = C.dim; ctx.textAlign = "left";
  ctx.fillText(modeLabel, 10, 12);
  ctx.textAlign = "right";
  ctx.fillText("VU", w - 10, 12);

  // needle
  const a = ang(vuPos(needleDb));
  ctx.strokeStyle = C.primary; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pivot.x + Math.cos(a) * 30, pivot.y + Math.sin(a) * 30);
  ctx.lineTo(pivot.x + Math.cos(a) * (R - 22), pivot.y + Math.sin(a) * (R - 22));
  ctx.stroke();
  // pivot cap
  ctx.fillStyle = C.hl;
  ctx.beginPath(); ctx.arc(pivot.x, h + 2, 14, Math.PI, 0); ctx.fill();

  ctx.restore();
}

/* ---------- Meter simulator (preview only) ---------- */
const grEl = document.getElementById("gr-readout");
let gr = 0, needle = VU_MIN, outLvl = -20, lastT = performance.now();

function simulate(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;

  // fake program: kick every 0.5 s + snare offbeat + noise floor
  const kick = Math.exp(-((t % 0.5)) / 0.09);
  const snare = Math.exp(-(((t + 0.25) % 1.0)) / 0.12) * 0.7;
  const sig = -30 + 22 * Math.max(kick, snare) + (Math.random() - 0.5) * 3;   // dBFS

  const inDb = state.input === -Infinity ? -200 : state.input;
  const cellIn = sig + inDb + 34;
  const r = state.ratio;
  let target = 0;
  if (!state.bypass && r !== "Out") {
    const ratio = r === "All" ? 20 : Number(r);
    const thr = -6;
    target = Math.max(0, (cellIn - thr) * (1 - 1 / ratio));
    if (r === "All") target += 8;
  }
  // ballistics: slowed for visibility, scaled by attack/release knobs
  const atk = attackTime(state.attack) / 1e6 * 40;
  const rel = releaseTime(state.release) / 1e3;
  const coef = target > gr ? 1 - Math.exp(-dt / atk) : 1 - Math.exp(-dt / rel);
  gr += (target - gr) * coef;

  const outDb = state.output === -Infinity ? -200 : state.output;
  const lvl = state.bypass ? -40 : cellIn - gr + outDb + 22;              // pseudo dBu
  outLvl += (lvl - outLvl) * (1 - Math.exp(-dt / 0.3));

  // needle source by mode
  let target_needle = VU_MIN, label = state.meter_mode;
  switch (state.meter_mode) {
    case "GR": target_needle = state.bypass ? VU_MIN : -gr; break;
    case "+8": target_needle = outLvl - 8; break;
    case "+4": target_needle = outLvl - 4; break;
    default: target_needle = VU_MIN; label = "OFF";
  }
  target_needle = clamp(target_needle, VU_MIN - 2, VU_MAX + 1);
  needle += (target_needle - needle) * (1 - Math.exp(-dt / 0.3));          // VU ballistics ~300 ms

  drawVU(needle, label);
  grEl.innerHTML = `<b>GR</b>${(-gr).toFixed(1)} dB`;
  requestAnimationFrame(simulate);
}
requestAnimationFrame(simulate);
</script>
</body>
</html>
